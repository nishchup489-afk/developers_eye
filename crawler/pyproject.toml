[project]
name = "crawler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["backend (>=0.1.0,<0.2.0)", "furl (>=2.1.4,<3.0.0)", "httpcore (>=1.0.9,<2.0.0)", "httpx (>=0.28.1,<0.29.0)", "bs4 (>=0.0.2,<0.0.3)", "lxml (>=6.1.3,<7.0.0)", "sqlalchemy[asyncio] (>=2.1.5,<3.0.0)", "greenlet (>=3.5.6,<4.0.0)", "asyncpg (>=0.32.0,<0.33.0)", "rich (>=15.0.0,<16.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "crawler", from = "src"}]

[tool.poetry.dependencies]
backend = {path = "../backend", develop = true}

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "colorama (>=0.4.6,<0.5.0)"
]
