name: Oracle container readiness

on:
  pull_request:
    paths:
      - "deploy/**"
      - "backend/src/backend/api/edge_trust.py"
      - "backend/src/backend/core/**"
      - "backend/src/backend/main.py"
      - ".github/workflows/oracle-readiness.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the ARM64 Python image to GHCR (otherwise build only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the Vercel frontend locally
        working-directory: frontend
        env:
          NEXT_BUILD_DIR: .next-oracle-readiness
        run: |
          npm ci
          npm run build
      - name: Build and test isolated PG18, FastAPI and Caddy
        env:
          NEXT_BUILD_DIR: .next-oracle-readiness
        run: sudo --preserve-env=PATH,NEXT_BUILD_DIR python3 deploy/tests/smoke_stack.py --frontend --output oracle-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oracle-container-smoke
          path: oracle-smoke.json

  arm64:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-python" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.python
          platforms: linux/arm64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
