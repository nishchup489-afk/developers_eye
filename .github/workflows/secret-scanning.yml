
name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tracked-env-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Reject committed environment files
        shell: bash
        run: |
          files=$(git ls-files |
            grep -E '(^|/)\.env($|\.)' |
            grep -Ev '(^|/)\.env\.example$' || true)

          if [ -n "$files" ]; then
            echo "ERROR: Tracked environment files detected:"
            echo "$files"
            exit 1
          fi

      - name: Reject hardcoded reporting key in example
        shell: bash
        run: |
          if grep -Eq '^CRAWLER_REPORT_API_KEY=[^[:space:]#]+' backend/.env.example; then
            echo "ERROR: Reporting key must be empty in .env.example"
            exit 1
          fi
