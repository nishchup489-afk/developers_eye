# 2 OCPU / 12 GB variant of postgresql.conf. Select it in .env with
#   POSTGRES_CONFIG=postgresql-12gb.conf
#   POSTGRES_SHM_SIZE=3gb
# Sized for 12 GB RAM on network block storage, with search and crawl sharing a box.
listen_addresses = '*'
max_connections = 60

shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# Block storage: random reads cost little more than sequential ones.
random_page_cost = 1.2
effective_io_concurrency = 100

# Writes. A crash can lose the last moments of commits but never corrupts data,
# and the crawler and indexer simply redo that work.
synchronous_commit = off
wal_compression = on
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# High churn on crawl_target, crawl_host and vocabulary_change.
autovacuum_max_workers = 4
autovacuum_naptime = 15s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 2000

idle_in_transaction_session_timeout = 5min
log_min_duration_statement = 1000
log_lock_waits = on
log_checkpoints = on
