# API and workers on a 4 OCPU / 24 GB Oracle A1 VM; frontend on Vercel.
# Verify your tenancy's current allowance before provisioning. See deploy/README.md.
name: developers-eye

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-python: &python
  build:
    context: ..
    dockerfile: deploy/Dockerfile.python
  restart: unless-stopped
  stop_grace_period: 45s
  logging: *logging
  env_file: ${DEPLOY_ENV_FILE:-.env}
  environment: &python-env
    DATABASE_URL: postgresql+asyncpg://developers_eye:${POSTGRES_PASSWORD:?set in deploy/.env}@db/developers_eye
    # Workers: 2 + 2 connections each. The API overrides this below.
    DB_POOL_SIZE: "2"
    DB_MAX_OVERFLOW: "2"
    APP_ENV: production
    EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?set a 32+ character secret in deploy/.env}
    API_DOCS_ENABLED: "false"
    CRAWLER_REPORT_API_KEY: ${CRAWLER_REPORT_API_KEY:?set in deploy/.env}
    CRAWLER_LOG_TO_FILE: "false"
    AI_OVERVIEW_CLIENT_IP_HEADER: ""
  depends_on:
    migrate:
      condition: service_completed_successfully

x-indexer: &indexer
  <<: *python
  command: ["python", "-m", "indexer.worker.runner", "--forever", "--batch-size", "100", "--concurrency", "2"]

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: developers_eye
      POSTGRES_DB: developers_eye
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - type: bind
        source: ${PGDATA_HOST_PATH:-/data/pgdata}
        target: /var/lib/postgresql
        bind:
          create_host_path: false
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: 6gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developers_eye -d developers_eye"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *python
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *python
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-proxy-headers"]
    environment:
      <<: *python-env
      DB_POOL_SIZE: "8"
      DB_MAX_OVERFLOW: "2"
      # Identity comes only from the authenticated edge middleware, never XFF.
      FORWARDED_ALLOW_IPS: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Off by default: `docker compose up -d` never starts it. Start it on purpose with
  #   docker compose --profile crawl up -d crawler
  # and stop it with `docker compose stop crawler`; the indexer keeps draining.
  # Two slots with a 2 s per-host gap is about 1 page/s. Concurrency sets the pace
  # only: corpus size is capped per source (cap-sources.sh) and by disk-guard.sh.
  crawler:
    <<: *python
    profiles: ["crawl"]
    command: ["python", "-m", "crawler.worker.runner", "--forever", "--concurrency", "2", "--batch-size", "2",
              "--min-interval-seconds", "${ADMIN_HOST_MIN_INTERVAL_SECONDS:-2}"]
    deploy:
      replicas: 1

  indexer-0:
    <<: *indexer
    environment:
      <<: *python-env
      INDEXER_SHARD_COUNT: "1"
      INDEXER_SHARD_INDEX: "0"

  maintenance:
    <<: *python
    command: ["sh", "-c", "while true; do python -m backend.admin_services.maintenance --purge-events; sleep 86400; done"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set in deploy/.env}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
